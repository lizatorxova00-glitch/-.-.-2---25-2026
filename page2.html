<section class="hero">

    <div class="container">

        <h1>Оставь заявку</h1>

        <p>
            Дай нам знать, если мы заинтересовали вас
        </p>

    </div>

</section>

<section class="contact">

    <div class="container">

        <form class="contact-form">

            <div class="row">

                <div class="input-box">

                    <label>Полное имя *</label>

                    <input type="text" placeholder="Иван Иванов">

                </div>

                <div class="input-box">

                    <label>Email *</label>

                    <input type="email" placeholder="johndoe@gmail.com">

                </div>

            </div>

            <div class="row">

                <div class="input-box">

                    <label>Телефон *</label>

                    <input type="text" placeholder="+7 (999) 999-99-99">

                </div>

                <div class="input-box">

                    <label>Задача *</label>

                    <input type="text" placeholder="Задача...">

                </div>

            </div>

            <div class="input-box full">

                <label>Описание задачи *</label>

                <textarea placeholder="Ваше описание..."></textarea>

            </div>

            <button type="submit">
                Отправить
            </button>

        </form>

    </div>

</section>

 <footer>
